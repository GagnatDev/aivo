# Deployment + Service for aivo. Source pattern: workbench/k8s/deployment.yml.
# Trimmed for v1: no Ingress (the bot is an outbound Discord gateway client — nothing
# inbound from the internet is needed yet; the aivo.homectl.no ingress arrives with
# the YouTube OAuth-callback slice) and no S3 env mappings (no bucket).
# $IMAGE_TAG is substituted at deploy time by the deploy workflow (commit SHA).
#
# NOTE: not applied by this slice — infra onboarding (Terraform, secrets, kubectl)
# is roadmap step 2 and runs separately.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aivo
  namespace: homectl
spec:
  replicas: 1
  # Single-instance, stateful gateway: never run two pods at once (would open two
  # Discord gateway connections / duplicate any future scheduler).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aivo
  template:
    metadata:
      labels:
        app: aivo
    spec:
      containers:
        - name: aivo
          image: rg.fr-par.scw.cloud/homectl/aivo:$IMAGE_TAG
          ports:
            - containerPort: 8080
          envFrom:
            # DATABASE_URL (Terraform-managed).
            - secretRef:
                name: aivo-terraform-secrets
            # DISCORD_BOT_TOKEN, DISCORD_APP_ID, DISCORD_GUILD_ID,
            # OWNER_DISCORD_USER_ID (hand-managed via `kubectl create secret`).
            - secretRef:
                name: aivo-secrets
                optional: true
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aivo
  namespace: homectl
spec:
  selector:
    app: aivo
  ports:
    - port: 80
      targetPort: 8080
