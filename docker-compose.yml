# Local dev stack. Source pattern: workbench/docker-compose.yml, trimmed to just
# Postgres (aivo has no object-storage bucket in v1). The bot itself is run with
# `pnpm dev` against a real Discord token from .env, not from compose.
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: aivo
      POSTGRES_PASSWORD: aivo
      POSTGRES_DB: aivo
    ports:
      - "5532:5432"
    volumes:
      # Postgres 18+ images keep PGDATA under /var/lib/postgresql/<major>/docker and
      # refuse to start with a volume at the old .../data path. The volume is named per
      # major so an existing Postgres 16 volume is left alone rather than misread.
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivo -d aivo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres18_data:
