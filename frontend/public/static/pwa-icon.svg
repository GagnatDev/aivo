<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2436"/>
      <stop offset="1" stop-color="#0f1218"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79adff"/>
      <stop offset="1" stop-color="#5b9cf5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#dcecff"/>
      <stop offset="1" stop-color="#5b9cf5"/>
    </radialGradient>
    <radialGradient id="eye" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#bfe0ff"/>
      <stop offset="1" stop-color="#7fb4ff"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <g transform="translate(256 256) scale(1) translate(-256 -256)">
    <!-- antenna -->
    <rect x="250" y="120" width="12" height="40" rx="6" fill="#4f8be8"/>
    <circle cx="256" cy="112" r="18" fill="url(#glow)"/>
    <!-- side ears -->
    <rect x="116" y="228" width="22" height="62" rx="10" fill="#4f8be8"/>
    <rect x="374" y="228" width="22" height="62" rx="10" fill="#4f8be8"/>
    <!-- head -->
    <rect x="132" y="152" width="248" height="212" rx="50" fill="url(#head)"/>
    <!-- face screen -->
    <rect x="164" y="190" width="184" height="138" rx="34" fill="#0d1320"/>
    <!-- eyes -->
    <rect x="200" y="224" width="32" height="46" rx="16" fill="url(#eye)"/>
    <rect x="280" y="224" width="32" height="46" rx="16" fill="url(#eye)"/>
    <!-- smile -->
    <path d="M212 294 Q256 324 300 294" fill="none" stroke="#7fb4ff"
          stroke-width="12" stroke-linecap="round"/>
    <!-- neck + shoulders -->
    <rect x="240" y="364" width="32" height="24" fill="#4f8be8"/>
    <path d="M150 460 Q150 402 210 396 L302 396 Q362 402 362 460 Z" fill="url(#head)"/>
  </g>
</svg>