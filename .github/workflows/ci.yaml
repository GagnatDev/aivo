# CI (test + build) for aivo. Source pattern: workbench/.github/workflows/ci.yaml
# (no e2e job yet).
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Static checks run before tests so a type or lint failure is reported
      # distinctly from a test failure (and fails fast without spinning up Docker).
      - name: Backend typecheck
        run: pnpm --filter @aivo/backend run typecheck

      - name: Backend lint & format check
        run: pnpm --filter @aivo/backend run lint

      - name: Frontend typecheck
        run: pnpm --filter @aivo/frontend run typecheck

      - name: Frontend lint & format check
        run: pnpm --filter @aivo/frontend run lint

      # Backend tests spin up Postgres via Testcontainers (no external services).
      - name: Backend tests
        run: pnpm --filter @aivo/backend run test

      - name: Frontend tests
        run: pnpm --filter @aivo/frontend run test

      - name: Backend build
        run: pnpm --filter @aivo/backend run build

      - name: Frontend build
        run: pnpm --filter @aivo/frontend run build

      # Exercise the exact image definition shipped to production, including the
      # pinned Node image, Corepack/pnpm bootstrap, bundle, and final-stage copies.
      - name: Production image build
        run: docker build --tag aivo:ci .

      - name: Validate local Compose stack
        run: docker compose config --quiet
